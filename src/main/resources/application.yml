spring:
  application:
    version: ${APP_VERSION:1.0.0}
  datasource:
    url: jdbc:sqlite:bot_usage.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  ai:
    openai:
      chat:
        enabled: true
      embedding:
        enabled: false
      image:
        enabled: false
      audio:
        transcription:
          enabled: false
        speech:
          enabled: false
      api-key: ${OPENAI_API_KEY:}

llm:
  open-ai:
    intelligent-model: # $2.50 / 1M input tokens $10.00 / 1M output tokens
      model: ${OPENAI_INTELLIGENT_MODEL:gpt-4o}
      price:
        input: ${OPENAI_INTELLIGENT_MODEL_INPUT_PRICE:2.5}
        output: ${OPENAI_INTELLIGENT_MODEL_OUTPUT_PRICE:10}
    fast-model: # $0.15 / 1M input tokens $0.60 / 1M output tokens
      model: ${OPENAI_FAST_MODEL:gpt-4o-mini}
      price:
        input: ${OPENAI_FAST_MODEL_INPUT_PRICE:0.15}
        output: ${OPENAI_FAST_MODEL_OUTPUT_PRICE:0.6}

telegram:
  bot:
    token: ${BOT_TOKEN:}
    username: ${BOT_USERNAME:}
  authorized-users: ${AUTHORIZED_USERS:}
  authorized-chat-group-id: ${AUTHORIZED_CHAT_GROUP_ID:}
  developer-chat-id: ${DEVELOPER_CHAT_ID:}

app:
  storage:
    max-messages: ${MAX_MESSAGES:50}
  rate-limit:
    summary-command-minutes: ${SUMMARY_COMMAND_MINUTES:1}
